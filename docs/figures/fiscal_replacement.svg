<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<rect width="980" height="600" fill="#fcfcfb"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#0b0b0b">Governments have not replaced falling aid</text>
<text x="24" y="60" font-size="13" fill="#52514e">Change in government health spending per person (US$) for a US$1 change in aid per person, with 95% confidence intervals</text>
<text x="24" y="80" font-size="13" fill="#52514e">Two-way fixed-effects regression: 97 countries, 2002-2023, 2,134 country-years; controls for GDP growth; errors clustered by country</text>
<line x1="330.0" y1="102" x2="330.0" y2="446" stroke="#e6e5e1" stroke-width="1"/>
<text x="330.0" y="464" font-size="12" fill="#52514e" text-anchor="middle">-0.6</text>
<line x1="428.3" y1="102" x2="428.3" y2="446" stroke="#e6e5e1" stroke-width="1"/>
<text x="428.3" y="464" font-size="12" fill="#52514e" text-anchor="middle">-0.4</text>
<line x1="526.7" y1="102" x2="526.7" y2="446" stroke="#e6e5e1" stroke-width="1"/>
<text x="526.7" y="464" font-size="12" fill="#52514e" text-anchor="middle">-0.2</text>
<line x1="625.0" y1="102" x2="625.0" y2="446" stroke="#52514e" stroke-width="1.5"/>
<text x="625.0" y="464" font-size="12" fill="#52514e" text-anchor="middle">0</text>
<line x1="723.3" y1="102" x2="723.3" y2="446" stroke="#e6e5e1" stroke-width="1"/>
<text x="723.3" y="464" font-size="12" fill="#52514e" text-anchor="middle">+0.2</text>
<line x1="821.7" y1="102" x2="821.7" y2="446" stroke="#e6e5e1" stroke-width="1"/>
<text x="821.7" y="464" font-size="12" fill="#52514e" text-anchor="middle">+0.4</text>
<line x1="920.0" y1="102" x2="920.0" y2="446" stroke="#e6e5e1" stroke-width="1"/>
<text x="920.0" y="464" font-size="12" fill="#52514e" text-anchor="middle">+0.6</text>
<text x="625.0" y="486" font-size="12" fill="#52514e" text-anchor="middle">US$ change in government health spending per person, per US$1 change in aid</text>
<text x="316" y="156.2" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="end">Aid per person falls this year</text>
<line x1="562.2" y1="151.2" x2="760.0" y2="151.2" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
<circle cx="661.1" cy="151.2" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="770.0" y="155.2" font-size="12" fill="#52514e">+0.07 (-0.13 to +0.27)</text>
<text x="316" y="238.8" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="end">Aid per person fell last year</text>
<line x1="599.8" y1="233.8" x2="763.8" y2="233.8" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
<circle cx="681.8" cy="233.8" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="773.8" y="237.8" font-size="12" fill="#52514e">+0.12 (-0.05 to +0.28)</text>
<text x="316" y="321.2" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="end">Aid per person rises</text>
<line x1="550.9" y1="316.2" x2="696.1" y2="316.2" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
<circle cx="623.5" cy="316.2" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="706.1" y="320.2" font-size="12" fill="#52514e">0.00 (-0.15 to +0.14)</text>
<line x1="24" y1="357.5" x2="920" y2="357.5" stroke="#e6e5e1" stroke-width="1"/>
<text x="316" y="393.8" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="end">Implied replacement rate</text>
<text x="316" y="410.8" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="end">(minus the sum of the two fall terms)</text>
<line x1="403.6" y1="398.8" x2="660.6" y2="398.8" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
<circle cx="532.1" cy="398.8" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="670.6" y="402.8" font-size="12" fill="#52514e">-0.19 (-0.45 to +0.07)</text>
<text x="24" y="530" font-size="11" fill="#52514e">Reading: a positive coefficient on an aid fall means government health spending fell alongside the aid. Replacement would appear as a negative</text>
<text x="24" y="545" font-size="11" fill="#52514e">coefficient on the fall terms. The implied replacement rate is -0.19, so governments cut about US$0.19 of their own spending per US$1 of aid</text>
<text x="24" y="560" font-size="11" fill="#52514e">lost, and the interval spans zero. This is why No Government Replacement is the dashboard's default. Source: model_data/regressions.json</text>
<text x="24" y="575" font-size="11" fill="#52514e">(prepare_model.py; IHME Development Assistance for Health and IHME Global Health Spending, constant 2023 US$).</text>
</svg>