
# Colors mirror theme.py (BRAND, SURFACE, SURFACE_TINT, INK)
[theme]
base = "light"
primaryColor = "#63458A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FAF6FB"
textColor = "#1F1A2B"
borderColor = "#ECE6F0"
font = "Libre Franklin:https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&display=swap"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap"

[client]
# no Deploy button or developer menu: the app should read like a website
toolbarMode = "minimal"
